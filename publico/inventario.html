<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Inventario | Minimarket Meilanys</title><link rel="stylesheet" href="./recursos/estilos/styles.css"></head>
<body><main class="ai-dashboard" style="max-width:1100px;margin:32px auto;padding:20px"><a href="./index.html">Volver a la tienda</a><p class="eyebrow">Gestión empresarial</p><h1>Inventario</h1><p id="status">Cargando inventario...</p><div id="inventory"></div></main>
<script>
const status = document.getElementById('status');
fetch('../servicios/inventario.php',{credentials:'same-origin'}).then(async response=>{const data=await response.json();if(!response.ok)throw new Error(data.error||'Acceso denegado');return data;}).then(data=>{document.getElementById('inventory').innerHTML=(data.inventario||[]).map(item=>`<form data-id="${item.producto_id}" style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:center;margin:10px 0"><strong>${item.nombre}</strong><input name="stock" type="number" min="0" value="${item.stock}"><input name="stock_minimo" type="number" min="0" value="${item.stock_minimo}"><button class="btn btn--primary" type="submit">Guardar</button></form>`).join('')||'<p>No hay productos en inventario.</p>';status.textContent='Inventario conectado a Supabase.';document.querySelectorAll('form[data-id]').forEach(form=>form.addEventListener('submit',async event=>{event.preventDefault();const body={producto_id:Number(form.dataset.id),stock:Number(form.stock.value),stock_minimo:Number(form.stock_minimo.value)};const response=await fetch('../servicios/inventario.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await response.json();status.textContent=result.ok?'Inventario actualizado.':result.error;}));}).catch(error=>{status.textContent=error.message;status.style.color='#a33';});
</script></body></html>
